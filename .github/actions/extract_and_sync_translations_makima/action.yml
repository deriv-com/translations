name: "Extract and sync translations (Makima, deprecated)"
description: "Deprecated: runs the v1.6.1 Makima action until Makima's sunset on 18 Nov 2026. Move to extract_and_sync_translations_rosetta"
# Kept so a workflow still on this path keeps working until Makima is switched
# off: it runs the released v1.6.1 action, pinned by commit, and warns. Planned:
# the first release after 18 Nov 2026 replaces this with a step that only fails
# with a pointer, and a later release removes the path. The inputs and outputs
# are v1.6.1's.
inputs:
  PROJECT_NAME:
    description: "Project name, the R2 folder the runtime reads from"
    required: true
  PROJECT_SOURCE_DIRECTORY:
    description: "Source directory to extract strings from"
    required: false
    default: "src"
  ENVIRONMENT:
    description: "staging or production"
    required: true
  TARGET_LOCALES:
    description: "Comma-separated locale codes, e.g. es,fr,pt"
    required: true
  MAKIMA_API_KEY:
    description: "Bearer token for the Makima gateway (secret)"
    required: true
  MAKIMA_API_BASE:
    description: "Base URL of the Makima API"
    required: true
  CDN_BASE_URL:
    description: "Where the current catalogues are served from"
    required: false
    default: "https://translations.deriv.com"
  PROTECTED_TERMS_FILE:
    description: "Optional JSON array of terms that must never be translated"
    required: false
    default: ""
  FALLBACK_ENVIRONMENT:
    description: "Optional: staging or production, consulted before Makima"
    required: false
    default: ""
  FALLBACK_MODE:
    description: "missing (default) or prefer"
    required: false
    default: "missing"
  OVERRIDES_FILE:
    description: "Optional path to reviewed corrections"
    required: false
    default: ""
  DRY_RUN:
    description: "true: write the catalogues as an artifact and skip the R2 upload"
    required: false
    default: "false"
  R2_ACCOUNT_ID:
    description: "R2 account ID"
    required: true
  R2_ACCESS_KEY_ID:
    description: "R2 access key ID"
    required: true
  R2_SECRET_ACCESS_KEY:
    description: "R2 secret access key"
    required: true
  R2_BUCKET_NAME:
    description: "R2 bucket name"
    required: true
outputs:
  status:
    description: "noop, completed or partial"
    value: ${{ steps.sync.outputs.status }}
  kept_back:
    description: "Number of strings left out by the token check"
    value: ${{ steps.sync.outputs.kept_back }}
  from_fallback:
    description: "Number of values taken from FALLBACK_ENVIRONMENT"
    value: ${{ steps.sync.outputs.from_fallback }}
  overridden:
    description: "Number of values OVERRIDES_FILE changed or added"
    value: ${{ steps.sync.outputs.overridden }}
runs:
  using: composite
  steps:
    - name: Warn that Makima is being switched off
      shell: bash
      run: echo "::warning::extract_and_sync_translations_makima is deprecated and stops working when Makima is switched off on 18 Nov 2026. Move to deriv-com/translations/.github/actions/extract_and_sync_translations_rosetta with ROSETTA_API_TOKEN and ROSETTA_API_BASE (https://translation-api.deriv.ai). See the README section 'Moving from the Makima action'."
    - name: Run the v1.6.1 Makima action
      id: sync
      # The last release with the Makima client, pinned by commit.
      uses: deriv-com/translations/.github/actions/extract_and_sync_translations_makima@fad07f6ff87b00b498332a7c7ddd63640d680975 # v1.6.1
      with:
        PROJECT_NAME: ${{ inputs.PROJECT_NAME }}
        PROJECT_SOURCE_DIRECTORY: ${{ inputs.PROJECT_SOURCE_DIRECTORY }}
        ENVIRONMENT: ${{ inputs.ENVIRONMENT }}
        TARGET_LOCALES: ${{ inputs.TARGET_LOCALES }}
        MAKIMA_API_KEY: ${{ inputs.MAKIMA_API_KEY }}
        MAKIMA_API_BASE: ${{ inputs.MAKIMA_API_BASE }}
        CDN_BASE_URL: ${{ inputs.CDN_BASE_URL }}
        PROTECTED_TERMS_FILE: ${{ inputs.PROTECTED_TERMS_FILE }}
        FALLBACK_ENVIRONMENT: ${{ inputs.FALLBACK_ENVIRONMENT }}
        FALLBACK_MODE: ${{ inputs.FALLBACK_MODE }}
        OVERRIDES_FILE: ${{ inputs.OVERRIDES_FILE }}
        DRY_RUN: ${{ inputs.DRY_RUN }}
        R2_ACCOUNT_ID: ${{ inputs.R2_ACCOUNT_ID }}
        R2_ACCESS_KEY_ID: ${{ inputs.R2_ACCESS_KEY_ID }}
        R2_SECRET_ACCESS_KEY: ${{ inputs.R2_SECRET_ACCESS_KEY }}
        R2_BUCKET_NAME: ${{ inputs.R2_BUCKET_NAME }}
